<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2eee2"/>
      <stop offset="50%" stop-color="#d8d4c9"/>
      <stop offset="100%" stop-color="#f7f3e8"/>
    </linearGradient>

    <linearGradient id="slotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4a46"/>
      <stop offset="50%" stop-color="#151512"/>
      <stop offset="100%" stop-color="#55554f"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55565a"/>
      <stop offset="45%" stop-color="#202124"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#panelGrad)"/>

  <g id="slider-section" font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="45" width="1060" height="320" rx="12" fill="#ece7d8" stroke="#9c978b" stroke-width="2"/>

    <g id="slider-01">
      <text x="155" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">BASS</text>
      <rect x="145" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="155" y1="125" x2="155" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="122" y1="125" x2="138" y2="125"/>
        <line x1="122" y1="155" x2="138" y2="155"/>
        <line x1="122" y1="185" x2="138" y2="185"/>
        <line x1="122" y1="215" x2="138" y2="215"/>
        <line x1="122" y1="245" x2="138" y2="245"/>
        <line x1="122" y1="275" x2="138" y2="275"/>
      </g>
      <rect x="113" y="198" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="125" y1="217" x2="185" y2="217" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <g id="slider-02">
      <text x="325" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">MID</text>
      <rect x="315" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="325" y1="125" x2="325" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="292" y1="125" x2="308" y2="125"/>
        <line x1="292" y1="155" x2="308" y2="155"/>
        <line x1="292" y1="185" x2="308" y2="185"/>
        <line x1="292" y1="215" x2="308" y2="215"/>
        <line x1="292" y1="245" x2="308" y2="245"/>
        <line x1="292" y1="275" x2="308" y2="275"/>
      </g>
      <rect x="283" y="155" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="295" y1="174" x2="355" y2="174" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <g id="slider-03">
      <text x="495" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">CROSSOVER</text>
      <rect x="485" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="495" y1="125" x2="495" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="462" y1="125" x2="478" y2="125"/>
        <line x1="462" y1="155" x2="478" y2="155"/>
        <line x1="462" y1="185" x2="478" y2="185"/>
        <line x1="462" y1="215" x2="478" y2="215"/>
        <line x1="462" y1="245" x2="478" y2="245"/>
        <line x1="462" y1="275" x2="478" y2="275"/>
      </g>
      <rect x="453" y="225" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="465" y1="244" x2="525" y2="244" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <g id="slider-04">
      <text x="665" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">DECAY</text>
      <rect x="655" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="665" y1="125" x2="665" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="632" y1="125" x2="648" y2="125"/>
        <line x1="632" y1="155" x2="648" y2="155"/>
        <line x1="632" y1="185" x2="648" y2="185"/>
        <line x1="632" y1="215" x2="648" y2="215"/>
        <line x1="632" y1="245" x2="648" y2="245"/>
        <line x1="632" y1="275" x2="648" y2="275"/>
      </g>
      <rect x="623" y="135" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="635" y1="154" x2="695" y2="154" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <g id="slider-05">
      <text x="835" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">DEPTH</text>
      <rect x="825" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="835" y1="125" x2="835" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="802" y1="125" x2="818" y2="125"/>
        <line x1="802" y1="155" x2="818" y2="155"/>
        <line x1="802" y1="185" x2="818" y2="185"/>
        <line x1="802" y1="215" x2="818" y2="215"/>
        <line x1="802" y1="245" x2="818" y2="245"/>
        <line x1="802" y1="275" x2="818" y2="275"/>
      </g>
      <rect x="793" y="185" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="805" y1="204" x2="865" y2="204" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <g id="slider-06">
      <text x="1005" y="85" text-anchor="middle" font-size="22" fill="#3b382f" letter-spacing="2">PRE-DELAY</text>
      <rect x="995" y="115" width="20" height="175" rx="10" fill="url(#slotGrad)"/>
      <line x1="1005" y1="125" x2="1005" y2="280" stroke="#0b0b09" stroke-width="3"/>
      <g stroke="#6f6a5f" stroke-width="2">
        <line x1="972" y1="125" x2="988" y2="125"/>
        <line x1="972" y1="155" x2="988" y2="155"/>
        <line x1="972" y1="185" x2="988" y2="185"/>
        <line x1="972" y1="215" x2="988" y2="215"/>
        <line x1="972" y1="245" x2="988" y2="245"/>
        <line x1="972" y1="275" x2="988" y2="275"/>
      </g>
      <rect x="963" y="245" width="84" height="38" rx="7" fill="url(#capGrad)" filter="url(#softShadow)"/>
      <line x1="975" y1="264" x2="1035" y2="264" stroke="#c8c8c8" stroke-width="3"/>
    </g>

    <text x="600" y="335" text-anchor="middle" font-size="16" fill="#6d675d" letter-spacing="4">
      REVERB PARAMETER CONTROL SECTION
    </text>
  </g>
</svg>