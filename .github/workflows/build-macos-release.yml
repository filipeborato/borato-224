name: Build Release Artifacts

on:
  push:
    branches:
      - master
      - "release/**"
      - "ci/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# The product version lives in exactly one place: the `project(... VERSION ...)`
# line in CMakeLists.txt. Each job reads it at runtime into BORATO224_VERSION
# (via GITHUB_ENV), so bumping the release is a one-line change in CMakeLists.txt
# and every artifact name / release asset follows automatically.

jobs:
  build-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: validated on an arm64 runner so auval can load the
          # arm64 component natively. arm64 code only ever ran on macOS 11.0+
          # (no Apple Silicon Mac shipped before Big Sur), so 10.15 is not a
          # valid minimum for an arm64 slice — we justify 11.0 here.
          - name: macOS arm64 Release
            runs_on: macos-15
            architecture: arm64
            artifact_suffix: macOS-arm64
            install_notes: INSTALL-macOS-arm64.md
            deployment_target: "11.0"
          # Intel: validated on an Intel runner so auval can load the x86_64
          # component natively. 10.15 (Catalina) is a safe minimum here.
          - name: macOS Intel Release
            runs_on: macos-15-intel
            architecture: x86_64
            artifact_suffix: macOS-intel
            install_notes: INSTALL-macOS-intel.md
            deployment_target: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version from CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^[[:space:]]*project\(Borato224[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$ver"
          echo "Resolved Borato 224 version: $ver"
          echo "BORATO224_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DBORATO224_FETCH_JUCE=ON
          -DBORATO224_COPY_PLUGIN_AFTER_BUILD=OFF
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build Release
        run: cmake --build build --config Release

      - name: Sign and validate Audio Unit
        shell: bash
        run: |
          set -euo pipefail

          au="build/Borato224_artefacts/Release/AU/Borato 224.component"
          test -d "$au"

          # Ad-hoc sign the component in place. Because we sign the bundle that
          # lives in the build tree, both the copy we install for auval AND the
          # copy we zip below are the exact same signed/validated bundle.
          codesign --force --deep --sign - "$au"
          codesign --verify --deep --strict --verbose=2 "$au"

          # Install into the per-user Components path so auval can discover it.
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Borato 224.component"
          cp -R "$au" "$components/"

          installed="$components/Borato 224.component"

          # Clear quarantine and the AU registration cache so a fresh scan runs.
          xattr -dr com.apple.quarantine "$installed" || true
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          rm -f "$HOME/Library/Caches/AudioUnitCache/com.apple.audiounits.cache" || true

          # Show the Mach-O architecture of the installed binary so the log makes
          # it obvious which slice (arm64 / x86_64) is being validated.
          file "$installed/Contents/MacOS/"*

          # Best-effort listing of our components; never fails the job.
          auval -a | grep -i Borato || true

          # Mandatory validation. With `set -e`, a non-zero auval exit fails this
          # step and therefore the whole workflow.
          auval -v aufx B224 Bora

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/Borato224_artefacts/Release"
          dist="dist"
          artifact_suffix="${{ matrix.artifact_suffix }}"
          install_notes="${{ matrix.install_notes }}"
          architecture="${{ matrix.architecture }}"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Borato 224.vst3"
          clap="$artifact_root/CLAP/Borato 224.clap"
          au="$artifact_root/AU/Borato 224.component"
          standalone="$artifact_root/Standalone/Borato 224.app"

          test -d "$vst3"
          test -d "$clap"
          test -d "$au"
          test -d "$standalone"

          base="Borato224-v${BORATO224_VERSION}-${artifact_suffix}"

          # NOTE: the AU is zipped from the same on-disk bundle that was signed
          # and validated in the previous step.
          ditto -c -k --keepParent "$vst3" "$dist/${base}-VST3.zip"
          ditto -c -k --keepParent "$clap" "$dist/${base}-CLAP.zip"
          ditto -c -k --keepParent "$au" "$dist/${base}-AU.zip"
          ditto -c -k --keepParent "$standalone" "$dist/${base}-Standalone.zip"

          cat > "$dist/$install_notes" <<'EOF'
          # Borato 224 macOS install (@ARCH@)

          The Audio Unit in this bundle is ad-hoc signed and was validated in CI
          with `auval -v aufx B224 Bora`. The VST3/CLAP/Standalone artifacts are
          unsigned development builds.

          ## VST3

          Unzip `Borato224-v@VER@-@SUFFIX@-VST3.zip` and copy `Borato 224.vst3` to:

          ```text
          ~/Library/Audio/Plug-Ins/VST3/
          ```

          ## AU

          Unzip `Borato224-v@VER@-@SUFFIX@-AU.zip` and copy `Borato 224.component` to:

          ```text
          ~/Library/Audio/Plug-Ins/Components/
          ```

          You can re-validate locally with:

          ```bash
          auval -v aufx B224 Bora
          ```

          ## CLAP

          Unzip `Borato224-v@VER@-@SUFFIX@-CLAP.zip` and copy `Borato 224.clap` to:

          ```text
          ~/Library/Audio/Plug-Ins/CLAP/
          ```

          ## Standalone

          Unzip `Borato224-v@VER@-@SUFFIX@-Standalone.zip` and move `Borato 224.app` to `/Applications` or any local folder.

          ## Gatekeeper note

          The unsigned artifacts may be blocked by macOS the first time. If needed, remove quarantine after unzipping:

          ```bash
          xattr -dr com.apple.quarantine "Borato 224.vst3"
          xattr -dr com.apple.quarantine "Borato 224.clap"
          xattr -dr com.apple.quarantine "Borato 224.component"
          xattr -dr com.apple.quarantine "Borato 224.app"
          ```
          EOF

          # Fill in placeholders (kept out of the quoted heredoc so the markdown
          # code fences survive verbatim).
          sed -i '' \
            -e "s/@VER@/${BORATO224_VERSION}/g" \
            -e "s/@SUFFIX@/${artifact_suffix}/g" \
            -e "s/@ARCH@/${architecture}/g" \
            "$dist/$install_notes"

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-VST3
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-AU
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-AU.zip
          if-no-files-found: error

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-CLAP
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-CLAP.zip
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-Standalone
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-Standalone.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-install-notes
          path: dist/${{ matrix.install_notes }}
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-VST3.zip
            dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-CLAP.zip
            dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-AU.zip
            dist/Borato224-v${{ env.BORATO224_VERSION }}-${{ matrix.artifact_suffix }}-Standalone.zip
            dist/${{ matrix.install_notes }}

  build-ubuntu:
    name: Ubuntu Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version from CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^[[:space:]]*project\(Borato224[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$ver"
          echo "Resolved Borato 224 version: $ver"
          echo "BORATO224_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBORATO224_FETCH_JUCE=ON
          -DBORATO224_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build Release
        run: cmake --build build

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/Borato224_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Borato 224.vst3"
          clap="$artifact_root/CLAP/Borato 224.clap"
          standalone="$artifact_root/Standalone/Borato 224"

          test -d "$vst3"
          test -f "$clap"
          test -f "$standalone"

          tar -czf "$dist/Borato224-v${BORATO224_VERSION}-Ubuntu-VST3.tar.gz" -C "$artifact_root/VST3" "Borato 224.vst3"
          tar -czf "$dist/Borato224-v${BORATO224_VERSION}-Ubuntu-CLAP.tar.gz" -C "$artifact_root/CLAP" "Borato 224.clap"
          tar -czf "$dist/Borato224-v${BORATO224_VERSION}-Ubuntu-Standalone.tar.gz" -C "$artifact_root/Standalone" "Borato 224"

          cat > "$dist/INSTALL-Ubuntu.md" <<'EOF'
          # Borato 224 Ubuntu install

          These artifacts are unsigned development builds.

          ## VST3

          Extract `Borato224-v@VER@-Ubuntu-VST3.tar.gz` and copy `Borato 224.vst3` to:

          ```text
          ~/.vst3/
          ```

          Example:

          ```bash
          mkdir -p ~/.vst3
          tar -xzf Borato224-v@VER@-Ubuntu-VST3.tar.gz
          cp -R "Borato 224.vst3" ~/.vst3/
          ```

          Then rescan plugins in your DAW.

          ## CLAP

          Extract `Borato224-v@VER@-Ubuntu-CLAP.tar.gz` and copy `Borato 224.clap` to:

          ```text
          ~/.clap/
          ```

          Example:

          ```bash
          mkdir -p ~/.clap
          tar -xzf Borato224-v@VER@-Ubuntu-CLAP.tar.gz
          cp "Borato 224.clap" ~/.clap/
          ```

          Then rescan plugins in your DAW.

          ## Standalone

          Extract `Borato224-v@VER@-Ubuntu-Standalone.tar.gz`, mark the app executable, and run it:

          ```bash
          tar -xzf Borato224-v@VER@-Ubuntu-Standalone.tar.gz
          chmod +x "Borato 224"
          ./"Borato 224"
          ```

          If the standalone app fails to start, install the JUCE runtime dependencies listed in the README Linux section.
          EOF

          # Fill in the version placeholder (kept out of the quoted heredoc so the
          # markdown code fences survive verbatim).
          sed -i -e "s/@VER@/${BORATO224_VERSION}/g" "$dist/INSTALL-Ubuntu.md"

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-VST3
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-VST3.tar.gz
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-Standalone
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-Standalone.tar.gz
          if-no-files-found: error

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-CLAP
          path: dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-CLAP.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-install-notes
          path: dist/INSTALL-Ubuntu.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-VST3.tar.gz
            dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-CLAP.tar.gz
            dist/Borato224-v${{ env.BORATO224_VERSION }}-Ubuntu-Standalone.tar.gz
            dist/INSTALL-Ubuntu.md
